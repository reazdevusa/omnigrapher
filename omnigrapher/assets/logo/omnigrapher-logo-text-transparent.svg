<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4D9FFF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#A44DFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3FF0D1;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Logo Icon (left side) -->
  <g transform="translate(30, 25)">
    <circle cx="75" cy="75" r="20" fill="url(#text-gradient)" filter="url(#glow)"/>
    <circle cx="75" cy="25" r="10" fill="#3FF0D1"/>
    <circle cx="125" cy="75" r="10" fill="#3FF0D1"/>
    <circle cx="75" cy="125" r="10" fill="#3FF0D1"/>
    <circle cx="25" cy="75" r="10" fill="#3FF0D1"/>
    <circle cx="110" cy="40" r="8" fill="#A44DFF"/>
    <circle cx="110" cy="110" r="8" fill="#A44DFF"/>
    <circle cx="40" cy="110" r="8" fill="#A44DFF"/>
    <circle cx="40" cy="40" r="8" fill="#A44DFF"/>
    <line x1="75" y1="55" x2="75" y2="35" stroke="#3FF0D1" stroke-width="3" stroke-linecap="round"/>
    <line x1="95" y1="75" x2="115" y2="75" stroke="#3FF0D1" stroke-width="3" stroke-linecap="round"/>
    <line x1="75" y1="95" x2="75" y2="115" stroke="#3FF0D1" stroke-width="3" stroke-linecap="round"/>
    <line x1="55" y1="75" x2="35" y2="75" stroke="#3FF0D1" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Text (right side) -->
  <text x="220" y="120" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="url(#text-gradient)" filter="url(#glow)">OmniGrapher</text>
  <text x="220" y="160" font-family="Arial, sans-serif" font-size="24" font-weight="500" fill="#D0D0D0" letter-spacing="0.5">Understand Everything. Connect Everything.</text>
</svg>
