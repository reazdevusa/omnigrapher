<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="blue-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4D9FFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A44DFF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cyan-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3FF0D1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4D9FFF;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="#0A0A0A" rx="64" ry="64"/>

  <!-- Central AI Core -->
  <circle cx="256" cy="256" r="48" fill="url(#blue-gradient)" filter="url(#glow)"/>

  <!-- Graph Nodes - Inner Ring -->
  <circle cx="256" cy="120" r="24" fill="#3FF0D1" filter="url(#glow)"/>
  <circle cx="392" cy="256" r="24" fill="#3FF0D1" filter="url(#glow)"/>
  <circle cx="256" cy="392" r="24" fill="#3FF0D1" filter="url(#glow)"/>
  <circle cx="120" cy="256" r="24" fill="#3FF0D1" filter="url(#glow)"/>

  <!-- Graph Nodes - Outer Ring -->
  <circle cx="356" cy="156" r="18" fill="#A44DFF" filter="url(#glow)"/>
  <circle cx="356" cy="356" r="18" fill="#A44DFF" filter="url(#glow)"/>
  <circle cx="156" cy="356" r="18" fill="#A44DFF" filter="url(#glow)"/>
  <circle cx="156" cy="156" r="18" fill="#A44DFF" filter="url(#glow)"/>

  <!-- Connection Lines - Inner -->
  <line x1="256" y1="208" x2="256" y2="144" stroke="url(#cyan-gradient)" stroke-width="4" stroke-linecap="round"/>
  <line x1="304" y1="256" x2="368" y2="256" stroke="url(#cyan-gradient)" stroke-width="4" stroke-linecap="round"/>
  <line x1="256" y1="304" x2="256" y2="368" stroke="url(#cyan-gradient)" stroke-width="4" stroke-linecap="round"/>
  <line x1="208" y1="256" x2="144" y2="256" stroke="url(#cyan-gradient)" stroke-width="4" stroke-linecap="round"/>

  <!-- Connection Lines - Outer -->
  <line x1="285" y1="185" x2="332" y2="174" stroke="#4D9FFF" stroke-width="3" stroke-linecap="round"/>
  <line x1="327" y1="285" x2="338" y2="332" stroke="#4D9FFF" stroke-width="3" stroke-linecap="round"/>
  <line x1="227" y1="327" x2="174" y2="338" stroke="#4D9FFF" stroke-width="3" stroke-linecap="round"/>
  <line x1="185" y1="227" x2="174" y2="180" stroke="#4D9FFF" stroke-width="3" stroke-linecap="round"/>

  <!-- Cross Connections (Graph Interconnectivity) -->
  <line x1="332" y1="174" x2="368" y2="256" stroke="#A44DFF" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="338" y1="332" x2="368" y2="256" stroke="#A44DFF" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="174" y1="338" x2="144" y2="256" stroke="#A44DFF" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="174" y1="180" x2="144" y2="256" stroke="#A44DFF" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Neural Network Pulse Effect -->
  <circle cx="256" cy="256" r="72" fill="none" stroke="url(#blue-gradient)" stroke-width="2" opacity="0.4"/>
  <circle cx="256" cy="256" r="96" fill="none" stroke="url(#blue-gradient)" stroke-width="1" opacity="0.2"/>
</svg>
