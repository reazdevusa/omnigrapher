name: ai-knowledge-base-suite

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: knowledge-base-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: knowledge_base
      POSTGRES_USER: awap_user
      POSTGRES_PASSWORD: awap_password
    ports:
      # Host port auto-resolved by scripts/resolve-ports.ps1 (-> .env)
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=mkdir -p /var/lib/postgresql/data/wal_archive && test ! -f /var/lib/postgresql/data/wal_archive/%f && cp %p /var/lib/postgresql/data/wal_archive/%f
      - -c
      - archive_timeout=5s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U awap_user -d knowledge_base"]
      interval: 5s
      timeout: 5s
      retries: 12

  chromadb:
    image: chromadb/chroma:0.6.3
    container_name: knowledge-base-chromadb
    restart: unless-stopped
    ports:
      - "${CHROMADB_PORT:-8002}:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/chroma
      ANONYMIZED_TELEMETRY: "FALSE"
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/8000"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 60s
      start_interval: 5s

  redis:
    image: redis:7-alpine
    container_name: knowledge-base-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --dir /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  ollama:
    image: ollama/ollama:latest
    container_name: knowledge-base-ollama
    hostname: knowledge-base-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - OLLAMA_ORIGINS=*
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_FLASH_ATTENTION=1
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 12

  ai-gateway:
    build:
      context: ./ai_gateway
      dockerfile: Dockerfile
    container_name: omnigrapher-ai-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8005}:8005"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PORT=8005
      - REDIS_HOST=redis
      # peft_engine runs on the host venv (scripts/start-peft-engine.ps1 picks
      # a free port and records PEFT_ENGINE_PORT in .env). Not a compose service.
      - PEFT_ENGINE_URL=http://host.docker.internal:${PEFT_ENGINE_PORT:-8003}/v1
      - OLLAMA_URL=http://knowledge-base-ollama:11434/v1
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8005/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  backend:
    build: ./knowledge_base_pilot
    container_name: knowledge-base-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8001}:8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PG_DATABASE_URL=postgresql+psycopg2://awap_user:awap_password@postgres:5432/knowledge_base
      - USE_POSTGRES=true
      - REDIS_URL=redis://redis:6379/0
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      # All outbound LLM traffic routes through the AI Gateway (failover,
      # PII guardrails, caching, rate limiting). Gateway exposes both
      # OpenAI /v1/* and Ollama-native /api/* passthrough endpoints.
      - OLLAMA_BASE_URL=http://ai-gateway:8005
      - PEFT_ENGINE_URL=http://ai-gateway:8005
      # GPU transcription on the RTX 3060 (falls back to CPU int8 at runtime
      # if CUDA is unavailable). large-v3 transcribes ~99 languages in their
      # native script; turbo serves confident English at ~7x realtime.
      - WHISPER_DEVICE=cuda
      - WHISPER_COMPUTE_TYPE=int8_float16
      - WHISPER_MODEL=large-v3
      - WHISPER_FAST_MODEL=turbo
      # Cloud ASR keys (GROQ_API_KEY/GEMINI_API_KEY/TRANSCRIBE_PROVIDER) are
      # read from knowledge_base_pilot/.env via load_dotenv — do NOT inject
      # them here, an empty compose value would shadow the file.
      - LLM_MODEL=llama3.2:latest
      - EMBED_MODEL=nomic-embed-text:latest
      - VLM_MODEL=llava:latest
      - GRAPH_RAG_ENABLED=false
      - PYTHONPATH=/workspace
      - AEO_DATABASE_URL=sqlite:////data/aeo/aeo_studio.db
      # SQLite primary store lives on a named volume — a bind mount on the
      # Windows host (9p) throws transient "disk I/O error" on commit.
      - SQLITE_DATABASE_URL=sqlite:////data/kb/kb.db
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ai-gateway:
        condition: service_healthy
    volumes:
      - ./knowledge_base_pilot:/app
      - .:/workspace:ro
      - aeo_data:/data/aeo
      - backend_data:/data/kb
      # Persist HuggingFace model cache across rebuilds/recreates —
      # re-downloading the Whisper model (~150MB) on every recreate is slow.
      - hf_models:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # No --reload: watchfiles cannot watch Windows bind mounts via Docker
    # Desktop (os error 5), which restart-loops the server and fails healthchecks.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8001/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

  celery:
    build: ./knowledge_base_pilot
    container_name: knowledge-base-celery
    restart: unless-stopped
    environment:
      - PG_DATABASE_URL=postgresql+psycopg2://awap_user:awap_password@postgres:5432/knowledge_base
      - USE_POSTGRES=true
      - REDIS_URL=redis://redis:6379/0
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - OLLAMA_BASE_URL=http://ai-gateway:8005
      - GRAPH_RAG_ENABLED=false
      - PYTHONPATH=/workspace
      - AEO_DATABASE_URL=sqlite:////data/aeo/aeo_studio.db
      - WHISPER_DEVICE=cuda
      - WHISPER_COMPUTE_TYPE=int8_float16
      - WHISPER_MODEL=large-v3
      - WHISPER_FAST_MODEL=turbo
      # Must share the backend's SQLite primary store (named volume — see
      # backend service). Without this celery reads a different kb.db.
      - SQLITE_DATABASE_URL=sqlite:////data/kb/kb.db
    volumes:
      - ./knowledge_base_pilot:/app
      - .:/workspace:ro
      - aeo_data:/data/aeo
      - backend_data:/data/kb
      - hf_models:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    command: ["celery", "-A", "app.celery_app", "worker", "-Q", "ingestion", "-l", "info", "--pool=solo"]

  frontend:
    build: ./web_app_nextjs
    container_name: knowledge-base-frontend
    restart: unless-stopped
    ports:
      # Host port is configurable - scripts/resolve-ports.ps1 picks a free
      # port when 3000 is taken by another project.
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - INTERNAL_API_URL=http://backend:8001
      # Browser-side API calls must follow the resolved backend host port.
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:${BACKEND_PORT:-8001}
      # Windows bind mounts don't propagate fs events — poll so hot reload works
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    volumes:
      - ./web_app_nextjs:/app
      - /app/node_modules

volumes:
  ollama_data:
  postgres_data:
  chroma_data:
  redis_data:
  aeo_data:
  backend_data:
  hf_models:
